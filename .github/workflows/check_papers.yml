name: Generate Podcast Episodes

on:
  # Triggered by toread when the feed changes (see PIPELINE.md)
  repository_dispatch:
    types: [pipeline-tick]

  # Daily fallback in case a dispatch is missed
  schedule:
    - cron: '0 7 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main for testing
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'

# Prevent concurrent runs to avoid race conditions with data files
concurrency:
  group: podcast-generation
  cancel-in-progress: false

jobs:
  generate-podcasts:
    runs-on: ubuntu-latest

    # Without this the only ceiling is GitHub's 6h job limit, and hitting it
    # registers as `cancelled` — which `if: failure()` does not match, so the
    # notify step below stays silent. Three runs died that way (2026-08-18 to
    # -20) with nothing reported. A timeout-minutes expiry is a *failure*, so
    # it both ends the burn early and actually pages someone.
    # Calibrated over the last 100 successful runs (measured 2026-08-20):
    # median 1.1min, p95 12.7min, slowest 17.4min end to end.
    timeout-minutes: 45

    permissions:
      contents: write  # For GitHub Releases
      # Lets the job mint the GitHub OIDC token that the Anthropic SDK
      # exchanges for a short-lived access token (Workload Identity
      # Federation). A permissions block drops every scope not listed, so
      # this must be enumerated or GitHub refuses to issue the token at all.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Check out the live branch tip, not the (possibly stale) SHA that
          # triggered this run. A queued run pinned to an older SHA would
          # regenerate data/feed from stale inputs — reprocessing already-done
          # papers (duplicate episodes, wasted TTS) and producing an
          # unmergeable rebase conflict on the regenerated files at push time.
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        # requirements.lock is compiled from requirements.txt (uv pip compile);
        # regenerate it when requirements.txt changes.
        run: pip install -r requirements.lock

      - name: Set up Google credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p credentials
          printf '%s' "$GCP_SA_KEY" > credentials/service-account.json

      # Workload Identity Federation preflight. The generator mints its own
      # OIDC assertions in-process, one per token exchange — see
      # src/anthropic_credentials.py for why nothing is written to
      # ANTHROPIC_IDENTITY_TOKEN_FILE any more. This step mints one and throws
      # it away, so a broken rule, a missing id-token permission or a wrong
      # audience fails here in seconds instead of twenty minutes into a run.
      # An assertion is only burned by an exchange; an unused one just expires.
      - name: Verify OIDC minting
        run: python -m src.anthropic_credentials

      - name: Run podcast generator
        # The step that has hung every time: TTS, the Drive download loop and
        # ffmpeg all live under it. ~1.7x the slowest generator run observed.
        timeout-minutes: 30
        env:
          # Python block-buffers stdout when it is a pipe, so a killed run
          # loses everything it printed — a successful run flushes 82 lines
          # under one timestamp, and the three 6h burns plus the 30min timeout
          # kill all produced literally no generator output. `-u` below is
          # what makes the log end on the last operation that completed.
          # With faulthandler armed, the SIGABRT from `timeout` also dumps a
          # traceback of every thread, naming the exact line it is stuck on.
          PYTHONFAULTHANDLER: 1
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Workload Identity Federation — no API key. The SDK exchanges a
          # GitHub OIDC assertion for a short-lived access token, and the
          # assertion is minted inside each exchange from the ACTIONS_ID_TOKEN_*
          # pair the runner injects into this step. Do not reintroduce
          # ANTHROPIC_API_KEY here: it outranks federation in the credential
          # chain and would silently shadow it.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          # Required when the federation rule is scoped to more than one
          # workspace: without it the token exchange 401s. Harmless when the
          # rule resolves to a single workspace, and empty if the var is unset.
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials/service-account.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PODCAST_TITLE: "Research Radio"
          PODCAST_DESCRIPTION: "AI-generated deep dives into computational social science research. Papers curated by Fabio Giglietto, scripts by Anthropic's Claude, narration by Google Gemini."
          PODCAST_AUTHOR: "Fabio Giglietto, Claude & Gemini"
          PODCAST_EMAIL: "fabio.giglietto+research-radio@gmail.com"
          PODCAST_WEBSITE: "https://fabiogiglietto.github.io/research-radio"
        # 25m sits under the 30m timeout-minutes ceiling on purpose: GitHub's
        # own kill produces no traceback, so we have to get there first.
        run: timeout --signal=SIGABRT --kill-after=1m 25m python -u src/main.py

      - name: Validate sync before commit
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Validating consistency between MP3 files and episodes..."
          # Validation is advisory only: a non-zero exit (e.g. papers kept in
          # processed.json on purpose with no episode) must not fail the run.
          # GitHub runs this block with `bash -e`, so guard the call inline.
          if ! python scripts/validate_sync.py; then
            echo "::warning::Sync validation found issues. Check the logs above."
          fi

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/processed.json docs/episodes.json docs/feed.xml
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update podcast data [skip ci]"

          # Commit first (above) so the working tree is clean, THEN rebase onto
          # the latest remote and push. Retry to survive a concurrent push from
          # the pipeline-tick run racing on the same ref.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected (remote moved); retrying..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      # Propagate the tick downstream even if no episode was produced this run,
      # so github.io still picks up the new toread feed.
      - name: Trigger downstream pipeline (github.io)
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: fabiogiglietto/fabiogiglietto.github.io
          event-type: pipeline-tick

      # The generator deliberately exits 0 even when every paper failed, so
      # that the commit and the downstream dispatch above still run — a TTS
      # outage must not stall github.io and fg-zettelkasten, and feed.xml still
      # needs to publish any earlier episode whose pub_date has now arrived.
      # It leaves a marker instead, and the job is failed here, once the work
      # that had to happen has happened. Before this existed, the 2026-08-20
      # run reported "Generated: 0, Failed: 5" as a green build and went
      # unnoticed for three days.
      # `if: always()` so this still runs when an earlier step failed; the
      # Slack step below matches on failure() either way.
      - name: Fail the run if no episodes were produced
        if: always()
        run: |
          if [ -f .generator-total-failure ]; then
            echo "::error::Generator produced no episodes and hit real errors."
            exit 1
          fi

      # Pipeline observability — alert on any failed run. No-ops until a
      # SLACK_WEBHOOK_URL (or SLACK_BOT_TOKEN + vars.OPS_SLACK_CHANNEL)
      # is configured in this repo's settings.
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ALERT_CHANNEL: ${{ vars.OPS_SLACK_CHANNEL }}
          ALERT_TEXT: ":rotating_light: ${{ github.repository }} / ${{ github.workflow }} failed (${{ github.event_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          # Ops alerts belong in the channel OPS_SLACK_CHANNEL names, so the
          # explicit channel wins over the webhook. The webhook is bound to
          # #toread at creation and cannot be redirected from here; it stays
          # only as a last resort for a repo with no bot token.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_ALERT_CHANNEL" ]; then
            resp=$(jq -n --arg ch "$SLACK_ALERT_CHANNEL" --arg text "$ALERT_TEXT" '{channel: $ch, text: $text}' \
              | curl -s -X POST -H "Authorization: Bearer $SLACK_BOT_TOKEN" -H 'Content-Type: application/json' \
                  -d @- https://slack.com/api/chat.postMessage)
            # chat.postMessage answers HTTP 200 with {"ok":false} for a channel the
            # bot is not in, so curl -f cannot see it and `|| true` would bury it.
            [ "$(jq -r '.ok' <<<"$resp")" = "true" ] \
              || echo "::error::Slack rejected the failure alert: $resp"
          elif [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "$ALERT_TEXT" '{text: $text}' \
              | curl -sf -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL" \
              || echo "::error::Slack webhook rejected the failure alert"
          else
            echo "No Slack credentials configured — skipping failure alert"
          fi
