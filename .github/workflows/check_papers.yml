name: Generate Podcast Episodes

on:
  # Triggered by toread when the feed changes (see PIPELINE.md)
  repository_dispatch:
    types: [pipeline-tick]

  # Daily fallback in case a dispatch is missed
  schedule:
    - cron: '0 7 * * *'

  # Allow manual trigger
  workflow_dispatch:

  # Run on push to main for testing
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'config.py'
      - 'requirements.txt'
      - '.github/workflows/**'

# Prevent concurrent runs to avoid race conditions with data files
concurrency:
  group: podcast-generation
  cancel-in-progress: false

jobs:
  generate-podcasts:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # For GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Google credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          mkdir -p credentials
          printf '%s' "$GCP_SA_KEY" > credentials/service-account.json

      - name: Run podcast generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: credentials/service-account.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          PODCAST_TITLE: "Research Radio"
          PODCAST_DESCRIPTION: "AI-generated deep dives into computational social science research. Papers curated by Fabio Giglietto, scripts by Anthropic's Claude, narration by Google Gemini."
          PODCAST_AUTHOR: "Fabio Giglietto, Claude & Gemini"
          PODCAST_EMAIL: "fabio.giglietto+research-radio@gmail.com"
          PODCAST_WEBSITE: "https://fabiogiglietto.github.io/research-radio"
        run: python src/main.py

      - name: Validate sync before commit
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          echo "Validating consistency between MP3 files and episodes..."
          # Validation is advisory only: a non-zero exit (e.g. papers kept in
          # processed.json on purpose with no episode) must not fail the run.
          # GitHub runs this block with `bash -e`, so guard the call inline.
          if ! python scripts/validate_sync.py; then
            echo "::warning::Sync validation found issues. Check the logs above."
          fi

      - name: Commit updated data files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/processed.json docs/episodes.json docs/feed.xml
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update podcast data [skip ci]"

          # Commit first (above) so the working tree is clean, THEN rebase onto
          # the latest remote and push. Retry to survive a concurrent push from
          # the pipeline-tick run racing on the same ref.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt rejected (remote moved); retrying..."
            sleep 5
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      # Propagate the tick downstream even if no episode was produced this run,
      # so github.io still picks up the new toread feed.
      - name: Trigger downstream pipeline (github.io)
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: fabiogiglietto/fabiogiglietto.github.io
          event-type: pipeline-tick
